name: Image build

on:
 workflow_dispatch:
  inputs:
    no_cythonize:
      description: "Skip cythonization"
      type: boolean
      default: false
      required: false
    lw8_branch:
      description: "lw8 branch"
      type: string
      default: "master"
      required: false
    iscat_utils_branch:
      description: "iscat_utils branch"
      type: string
      default: "master"
      required: false
    iscat_branch:
      description: "iscat branch"
      type: string
      default: "master"
      required: false
    refeyn_io_branch:
      description: "refeyn_io branch"
      type: string
      default: "master"
      required: false
    dev_utils_branch:
      description: "dev_utils branch"
      type: string
      default: "master"
      required: false
 push:
  tags:
    - '*'
 schedule:
    - cron: '0 0 * * *'

jobs:
  deploy:
    name: Test and Deploy
    runs-on: yocto
    timeout-minutes: 500

    env:
      REFEYN_NO_CYTHONIZE: ${{ inputs.no_cythonize && '1' || '0' }}
      REFEYN_LW8_BRANCH: ${{ inputs.lw8_branch || 'master' }}
      REFEYN_ISCAT_UTILS_BRANCH: ${{ inputs.iscat_utils_branch || 'master' }}
      REFEYN_ISCAT_BRANCH: ${{ inputs.iscat_branch || 'master' }}
      REFEYN_REFEYN_IO_BRANCH: ${{ inputs.refeyn_io_branch || 'master' }}
      REFEYN_DEV_UTILS_BRANCH: ${{ inputs.dev_utils_branch || 'master' }}

    steps:
      - name: Clean build directory
        run: |
          mkdir -p toradex-refeyn
          rm -rf toradex-refeyn/build

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: toradex-refeyn/meta-refeyn

      - name: Build
        run: |
          cd toradex-refeyn
          env | grep REFEYN_

          # https://stackoverflow.com/a/57229018
          echo -e "[url \"https://api:${{secrets.REFEYN_CI_TOKEN}}@github.com/\"]\n\tinsteadOf = https://github.com/" >> .gitconfig
          echo -e "[url \"https://ssh:${{secrets.REFEYN_CI_TOKEN}}@github.com/\"]\n\tinsteadOf = ssh://git@github.com/" >> .gitconfig
          echo -e "[url \"https://git:${{secrets.REFEYN_CI_TOKEN}}@github.com/\"]\n\tinsteadOf = git@github.com:" >> .gitconfig

          export GITCONFIG_FILE=".gitconfig"
          kas build meta-refeyn/kas-project.yml

      - name: Upload Aquila-AM69-Refeyn-Lite-Image
        uses: actions/upload-artifact@v4
        with:
          name: Aquila-AM69-Refeyn-Lite-Image
          path: |
            toradex-refeyn/build/deploy-ti/images/aquila-am69-refeyn/Aquila-AM69-refeyn_Refeyn-Lite-Image-Tezi.tar

      - name: Upload Aquila-AM69-Refeyn-Image
        uses: actions/upload-artifact@v4
        with:
          name: Aquila-AM69-Refeyn-Image
          path: |
            toradex-refeyn/build/deploy-ti/images/aquila-am69-refeyn/Aquila-AM69-refeyn_Refeyn-Image-Tezi.tar

      - name: Upload Aquila-AM69-Refeyn-Fat-Image
        uses: actions/upload-artifact@v4
        with:
          name: Aquila-AM69-Refeyn-Fat-Image
          path: |
            toradex-refeyn/build/deploy-ti/images/aquila-am69-refeyn/Aquila-AM69-refeyn_Refeyn-Fat-Image-Tezi.tar

      - name: Upload Aquila-AM69-Refeyn-Lite-Update
        uses: actions/upload-artifact@v4
        with:
          name: Aquila-AM69-Refeyn-Lite-Update
          path: |
            toradex-refeyn/build/deploy-ti/images/aquila-am69-refeyn/Aquila-AM69-refeyn_Refeyn-Lite-Image-sysupdate.tar

      - name: Upload Aquila-AM69-Refeyn-Update
        uses: actions/upload-artifact@v4
        with:
          name: Aquila-AM69-Refeyn-Update
          path: |
            toradex-refeyn/build/deploy-ti/images/aquila-am69-refeyn/Aquila-AM69-refeyn_Refeyn-Image-sysupdate.tar

      - name: Cleanup
        if: always()
        run: |
          rm toradex-refeyn/.gitconfig
          find $DL_DIR -type f -atime +60 -delete
          find $SSTATE_DIR -type f -atime +60 -delete
