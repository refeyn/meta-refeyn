# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-refeyn"
BBFILE_PATTERN_meta-refeyn = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-refeyn = "10"

LAYERDEPENDS_meta-refeyn = "core"
LAYERSERIES_COMPAT_meta-refeyn = "scarthgap"
