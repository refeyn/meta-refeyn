name: Image build

on:
 workflow_dispatch:
 push:
  tags:
    - '*'
 schedule:
    - cron: '0 0 * * *'

jobs:
  deploy:
    name: Test and Deploy
    runs-on: yocto
    timeout-minutes: 500

    steps:
      - name: Clean build directory
        run: |
          mkdir -p toradex-refeyn
          rm -rf toradex-refeyn/build

      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: toradex-refeyn/meta-refeyn

      - name: Build
        run: |
          cd toradex-refeyn

          # https://stackoverflow.com/a/57229018
          echo -e "[url \"https://api:${{secrets.REFEYN_CI_TOKEN}}@github.com/\"]\n\tinsteadOf = https://github.com/" >> .gitconfig
          echo -e "[url \"https://ssh:${{secrets.REFEYN_CI_TOKEN}}@github.com/\"]\n\tinsteadOf = ssh://git@github.com/" >> .gitconfig
          echo -e "[url \"https://git:${{secrets.REFEYN_CI_TOKEN}}@github.com/\"]\n\tinsteadOf = git@github.com:" >> .gitconfig

          export GITCONFIG_FILE=".gitconfig"
          kas build meta-refeyn/kas-project.yml

      - uses: actions/upload-artifact@v4
        with:
          name: Apalis-iMX8-Refeyn-Lite-Image
          path: |
            toradex-refeyn/build/tmp/deploy/images/apalis-imx8-refeyn/Apalis-iMX8-refeyn_Refeyn-Lite-Image-Tezi.tar

      - uses: actions/upload-artifact@v4
        with:
          name: Apalis-iMX8-Refeyn-Image
          path: |
            toradex-refeyn/build/tmp/deploy/images/apalis-imx8-refeyn/Apalis-iMX8-refeyn_Refeyn-Image-Tezi.tar

      # - uses: actions/upload-artifact@v4
      #   with:
      #     name: Apalis-iMX8-Refeyn-Fat-Image
      #     path: |
      #       toradex-refeyn/build/tmp/deploy/images/apalis-imx8-refeyn/Apalis-iMX8-refeyn_Refeyn-Fat-Image-Tezi.tar

      - uses: actions/upload-artifact@v4
        with:
          name: Apalis-iMX8-Refeyn-Packages
          path: |
            toradex-refeyn/build/tmp/deploy/rpm/armv8a/python3-lw8-v*.rpm
            toradex-refeyn/build/tmp/deploy/rpm/armv8a/python3-lw8-data*.rpm
            toradex-refeyn/build/tmp/deploy/rpm/armv8a/python3-lw8-dbg*.rpm
            toradex-refeyn/build/tmp/deploy/rpm/armv8a/python3-iscat-1*.rpm
            toradex-refeyn/build/tmp/deploy/rpm/armv8a/python3-iscat-dbg*.rpm
            toradex-refeyn/build/tmp/deploy/rpm/armv8a/python3-iscat-utils-1*.rpm
            toradex-refeyn/build/tmp/deploy/rpm/armv8a/python3-iscat-utils-dbg*.rpm

      - name: Cleanup
        if: always()
        run: rm toradex-refeyn/.gitconfig
